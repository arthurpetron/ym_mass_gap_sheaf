# Lean axiom-gate audit — CI enforcement of AGENTS.md Rule 1.
#
# Runs on every Lean-relevant push to trusted `main`, plus explicit manual
# dispatches.  The full job is deliberately not a pull-request job: it is
# routed to a persistent self-hosted machine, where untrusted PR code must not
# execute. Fails if an observed tracked theorem in the YMGap Lean library has
# acquired a NEW axiom dependency not permitted by `lean/AXIOM_AUDIT.md` (the
# maintained baseline). Strict completeness/drift remains informational below.
#
# To accept new axiom dependencies after deliberate constructivity-budget
# review:
#
#     make lean-audit-update
#     git add lean/AXIOM_AUDIT.md && git commit
#
# To run locally before pushing:
#
#     make lean-audit            # non-strict: drift only
#     make lean-audit-strict     # strict: also new theorems / missing tracked theorems
#
# See scripts/lean_axiom_audit.py for the full drift semantics.

name: lean-axiom-audit

permissions:
  contents: read

# Keep at most one expensive all-module job queued/running.  A replacement job
# may cancel the old one; the process-conflict preflight below then refuses to
# start if the runner has not finished cleaning up the prior Lean process.
concurrency:
  group: ymgap-lean-full
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Ignore the Lake cache and prove a clean all-module build"
        required: true
        type: boolean
        default: true
  push:
    branches: ["main"]
    paths:
      - "lean/**"
      - "scripts/lean_axiom_audit.py"
      - "scripts/lean_import_guard.py"
      - "scripts/frontier_dag_check.py"
      - "reference/leanmillennium-pinned/**"
      - "Makefile"
      - ".github/workflows/lean-audit.yml"
jobs:
  axiom-audit:
    # A manual dispatcher may select an arbitrary ref in GitHub's UI.  Never
    # execute that branch code on the persistent personal machine.
    if: github.ref == 'refs/heads/main'
    # Set YMGAP_LEAN_RUNNER to the private repository runner's custom label.
    # There is intentionally no GitHub-hosted fallback: an absent/mistyped label
    # queues and times out rather than incurring hosted compute charges.
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - ${{ vars.YMGAP_LEAN_RUNNER || 'ymgap-m4max' }}
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Preserve only the local Lake cache across trusted main builds.  The
          # next step deletes every other ignored/untracked path.
          clean: false
          persist-credentials: false

      - name: Sanitize persistent checkout while retaining the local Lake cache
        shell: bash
        env:
          CLEAN_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_build || false }}
        run: |
          if [[ "$CLEAN_BUILD" == "true" ]]; then
            git clean -ffdx
          else
            git clean -ffdx -e lean/.lake/
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::The persistent runner checkout is not at the requested clean commit."
            exit 1
          fi

      - name: Static Lean import-graph guard
        run: make lean-import-guard

      - name: Read pinned Lean toolchain
        id: toolchain
        run: |
          echo "version=$(cat lean/lean-toolchain | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Fail closed on an unsafe build host
        shell: bash
        run: |
          min_kib=$((24 * 1024 * 1024))
          case "$(uname -s)" in
            Darwin)
              total_bytes=$(/usr/sbin/sysctl -n hw.memsize)
              total_kib=$((total_bytes / 1024))
              free_percent=$(
                /usr/bin/memory_pressure -Q |
                  awk '/System-wide memory free percentage:/ {
                    gsub(/%/, "", $5); print $5
                  }'
              )
              if [[ -z "$free_percent" ]]; then
                echo "::error::Could not determine currently available Mac memory."
                exit 1
              fi
              available_kib=$((total_kib * free_percent / 100))
              if ! /usr/bin/pmset -g batt | head -n 1 | grep -q "AC Power"; then
                echo "::error::The Mac runner must be connected to AC power."
                exit 1
              fi
              ;;
            Linux)
              total_kib=$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)
              available_kib=$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)
              ;;
            *)
              echo "::error::Unsupported build-runner operating system: $(uname -s)."
              exit 1
              ;;
          esac
          if [[ -z "$total_kib" || -z "$available_kib" || \
                "$total_kib" -lt "$min_kib" || "$available_kib" -lt "$min_kib" ]]; then
            echo "::error::The all-module build requires at least 24 GiB installed and currently available RAM."
            echo "::error::Configure YMGAP_LEAN_RUNNER with a >=24-GiB self-hosted runner label."
            exit 1
          fi
          if pgrep -ifl '(^|/)(lean|lake|pytest)( |$)'; then
            echo "::error::A Lean/Lake/pytest process is already active; refusing competing compilation."
            exit 1
          fi
          echo "Runner RAM preflight passed: $((total_kib / 1024 / 1024)) GiB installed, approximately $((available_kib / 1024 / 1024)) GiB available."

      - name: Install elan + Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "${{ steps.toolchain.outputs.version }}"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify Lean version
        run: |
          lean --version
          lake --version

      - name: Build full Lean library (all YMGap modules, one worker)
        shell: bash
        run: |
          set -o pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            caffeinate -dimsu nice -n 10 make lean-build LEAN_JOBS=1 2>&1 | tee lean-build.log
          else
            nice -n 10 make lean-build LEAN_JOBS=1 2>&1 | tee lean-build.log
          fi

      - name: Preserve the single full-build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-log-${{ github.run_id }}
          path: lean-build.log
          if-no-files-found: warn
          retention-days: 3

      # Frontier uninhabitedness guard — FAILS the build (not informational) if
      # any Clay-frontier type (Tier0Scorecard / UniformSpacingFloor /
      # ClayTarget) acquires an UNCONDITIONAL inhabitant. This is the exact
      # failure mode AGENTS.md exists to prevent (an agent "accidentally"
      # closing the Clay problem with a vacuous/circular term that still passes
      # the axiom gate), applied at the frontier. Independent of AXIOM_AUDIT.md,
      # so a routine `make lean-audit-update` cannot silence it. See
      # lean/YMGapGuard.lean.
      - name: Frontier uninhabitedness guard
        run: make lean-frontier-guard

      # Statement-hash DRIFT guard — FAILS the build if a pinned frontier statement
      # (ClayTargetPinned / ClayTarget / FrontierDAG / Tier0Scorecard /
      # UniformSpacingFloor or a shared param they reference) is silently WEAKENED
      # (a dropped field, loosened bound, ∀→∃). The inhabitation guard above cannot
      # see statement drift; this closes that attack. See lean/YMGapStatementGuard.lean.
      - name: Statement-hash drift guard
        run: make lean-statement-guard

      # Anti-proliferation (Rule 9.8) — FAILS if a new *Scorecard/*Frontier/*Target/*DAG
      # enumeration carrying OPEN residual atoms is added WITHOUT a bridge relating it
      # to the unified FrontierDAG (in either direction), forcing open atoms to be
      # accounted through the single source of truth rather than a parallel shard.
      # See scripts/frontier_dag_check.py.
      - name: Frontier-DAG anti-proliferation check
        run: make frontier-dag-check

      # Clay scorecard — the fixed-spacing rubric clauses stay MET (real proof terms
      # typecheck) while the continuum clauses stay OPEN. See ClayScorecard.lean.
      - name: Clay scorecard (fixed-spacing MET, continuum OPEN)
        run: make lean-rubric

      - name: Run axiom-gate audit (non-strict — drift only)
        run: python3 scripts/lean_axiom_audit.py --from-file lean-build.log

      # Strict mode is informational: it surfaces new theorems not yet in the
      # baseline and tracked theorems missing from the build.  We do NOT fail
      # the build on strict drift, because adding new theorems is normal in
      # PR work; the workflow message reminds maintainers to run
      # `make lean-audit-update` and review the manifest.
      - name: Run axiom-gate audit (strict — new/missing theorems, informational)
        continue-on-error: true
        run: |
          if ! python3 scripts/lean_axiom_audit.py --strict --from-file lean-build.log; then
            echo "::warning::Strict-mode audit surfaced new or missing theorems."
            echo "::warning::After review, run 'make lean-audit-update' and commit lean/AXIOM_AUDIT.md."
          fi
