[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ym-mass-gap-sheaf"
version = "0.1.0"
description = "Constructive Yang-Mills mass gap program via sheaf-theoretic inductive step"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Arthur Petron" },
]
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["computations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["lean", "formal", "visualizations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations (reinforces strict typing)
]
[tool.ruff.lint.per-file-ignores]
# tests can use math-label names (V1, V2, K_sf, ...), don't need return-type
# annotation, and assertions on math constants (KAPPA_SU2_*, etc.) trip the
# Yoda-condition heuristic.
"tests/*" = ["ANN201", "N802", "N803", "N806", "SIM300"]
# math labels like `kp_cap.K`, `s_k.kp_lf.rho` trip the Yoda heuristic.
"computations/block_spin.py" = ["SIM300"]
# math labels: N (gauge rank), C_2_min, KAPPA_SU2_*, etc.
"computations/heat_kernel.py" = ["N803", "N806", "N816"]
# math labels: C_value, K (heat kernel), twoJ, C_2_min_float, etc.
"computations/buffer_shell.py" = ["N803", "N806", "N816"]
# math labels: K_sf, K_lf, K_cap, etc.
"computations/small_field_kp.py" = ["N803", "N806", "N816"]
"computations/large_field_kp.py" = ["N803", "N806", "N816"]
"computations/overlap_kp.py" = ["N803", "N806", "N816"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
files = ["computations", "tests"]

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "sympy.*",
    "matplotlib.*",
]
ignore_missing_imports = true
