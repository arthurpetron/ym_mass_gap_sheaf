name = "YMGap"
defaultTargets = ["YMGap", "YMGapGuard", "YMGapStatementGuard"]

# The generated exact-rational certificate rows can require more C++ thread
# stack while Lean compares their fully normalized expressions.  This is a
# weak argument: it changes only the compiler process stack reservation and
# does not invalidate or alter theorem artifacts.
#
# `-M 20480` caps each lean worker at 20 GB: a runaway kernel computation
# then fails deterministically with "excessive memory consumption detected"
# instead of driving the whole machine into swap.  The ceiling is sized for
# the heaviest known module, HarmonicLowerSixTailBaseSemanticBridge, whose
# staged piece reconciliation peaks near 15 GB (measured 2026-07-16).  Pair
# with a worker cap when building (Lake spawns one worker per logical core
# by default and this Lake has no `--jobs` flag): `LEAN_NUM_THREADS=1 lake
# build`, or `make lean-build` which sets it.  Both are weak arguments and
# do not invalidate cached artifacts.
weakLeanArgs = ["-s", "65536", "-M", "20480"]

# Milestone 1.1 deliberately depends on nothing but Lean core: SU(2)
# Casimirs are exact rationals, so `Nat`/`Rat` suffice and no
# real-number infrastructure is needed. Later phases that touch
# moduli will introduce a constructive-reals module under
# `YMGap/Constructive/Reals.lean` per the AGENTS.md contract;
# Mathlib's `Real` is forbidden by Rule 3.

[[lean_lib]]
name = "YMGap"
# Compile every source module in the production namespace during a full library
# build, including modules not yet reachable from the selective `YMGap.lean`
# semantic/audit root. Targeted `lake build YMGap.Some.Module` checks remain
# targeted; this glob only expands the `YMGap` library target itself.
globs = ["YMGap.*"]

# Frontier uninhabitedness guard — a separate root that `import YMGap` and, at
# elaboration time, fails the build if any Clay-frontier type (Tier0Scorecard /
# UniformSpacingFloor / ClayTarget) becomes inhabited. See `YMGapGuard.lean`.
[[lean_lib]]
name = "YMGapGuard"

# Frontier STATEMENT-drift guard — a separate root that `import YMGap` and, at
# elaboration time, fails the build if the STATEMENT (type signature + field
# structure) of a Clay-frontier type or a shared parameter def is silently
# WEAKENED. Complements YMGapGuard (inhabitation) with a structural hash pin.
# See `YMGapStatementGuard.lean`.
[[lean_lib]]
name = "YMGapStatementGuard"
