name = "YMGap"
defaultTargets = ["YMGap", "YMGapGuard"]

# Milestone 1.1 deliberately depends on nothing but Lean core: SU(2)
# Casimirs are exact rationals, so `Nat`/`Rat` suffice and no
# real-number infrastructure is needed. Later phases that touch
# moduli will introduce a constructive-reals module under
# `YMGap/Constructive/Reals.lean` per the AGENTS.md contract;
# Mathlib's `Real` is forbidden by Rule 3.

[[lean_lib]]
name = "YMGap"

# Frontier uninhabitedness guard — a separate root that `import YMGap` and, at
# elaboration time, fails the build if any Clay-frontier type (Tier0Scorecard /
# UniformSpacingFloor / ClayTarget) becomes inhabited. See `YMGapGuard.lean`.
[[lean_lib]]
name = "YMGapGuard"
